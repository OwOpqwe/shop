<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login - Snack Store</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:linear-gradient(
        135deg,
        #0a0a0a 0%,
        #1a1a2e 100%
    );

    font-family:Arial,sans-serif;

    min-height:100vh;
}

.login-container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.login-box{
    background:#fff;
    padding:40px;
    border-radius:15px;
    width:400px;
    max-width:100%;
    box-shadow:0 8px 20px rgba(0,0,0,0.5);
}

.login-box h2{
    color:#333;
    text-align:center;
    margin-bottom:30px;
    font-size:1.8em;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    color:#333;
    font-weight:bold;
    margin-bottom:8px;
}

.form-group input{
    width:100%;
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    font-size:1em;
}

.form-group input:focus{
    outline:none;
    border-color:#007bff;
}

.btn{
    width:100%;
    padding:15px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:8px;
    font-size:1.1em;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.btn:hover{
    background:#0056b3;
}

.btn-secondary{
    background:#28a745;
}

.btn-secondary:hover{
    background:#1e7e34;
}

.btn-admin{
    background:#6f42c1;
}

.btn-admin:hover{
    background:#56329a;
}

.toggle-text{
    text-align:center;
    margin-top:20px;
    color:#666;
}

.toggle-text a{
    color:#007bff;
    cursor:pointer;
    text-decoration:underline;
}

.error-msg{
    color:red;
    text-align:center;
    margin-top:10px;
    display:none;
}

.success-msg{
    color:green;
    text-align:center;
    margin-top:10px;
    display:none;
}

.admin-info{
    background:#f1e9ff;
    color:#4b277d;
    padding:12px;
    border-radius:8px;
    margin-bottom:20px;
    text-align:center;
    font-size:14px;
}

</style>

</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h2 id="formTitle">
            🏪 Login to Snack Store
        </h2>


        <!-- =========================
             CUSTOMER LOGIN
        ========================== -->

        <div id="loginForm">

            <div class="form-group">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required>

            </div>


            <button
                class="btn"
                onclick="login()">
                Login
            </button>


            <!-- ADMIN BUTTON -->

            <button
                class="btn btn-admin"
                onclick="showAdminLogin()">
                🛡️ Admin Login
            </button>


            <div class="toggle-text">

                Don't have an account?

                <a onclick="showRegister()">
                    Register here
                </a>

            </div>

        </div>


        <!-- =========================
             ADMIN LOGIN
        ========================== -->

        <div
            id="adminLoginForm"
            style="display:none;">

            <div class="admin-info">

                🛡️ Admin login requires
                administrator permission
                and a verification code.

            </div>


            <div class="form-group">

                <label for="adminEmail">
                    Admin Email
                </label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter admin email"
                    required>

            </div>


            <div class="form-group">

                <label for="adminPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter admin password"
                    required>

            </div>


            <button
                class="btn btn-admin"
                onclick="adminLogin()">
                Continue as Admin
            </button>


            <div class="toggle-text">

                <a onclick="showLogin()">
                    Back to customer login
                </a>

            </div>

        </div>


        <!-- =========================
             ADMIN VERIFICATION
        ========================== -->

        <div
            id="verificationForm"
            style="display:none;">

            <div class="admin-info">

                🔐 Enter the 6-digit
                administrator verification code.

            </div>


            <div class="form-group">

                <label for="verificationCode">
                    Verification Code
                </label>

                <input
                    type="text"
                    id="verificationCode"
                    placeholder="Enter 6-digit code"
                    maxlength="6"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    required>

            </div>


            <button
                class="btn btn-admin"
                onclick="verifyAdminCode()">
                Verify Admin
            </button>


            <div class="toggle-text">

                <a onclick="showLogin()">
                    Cancel
                </a>

            </div>

        </div>


        <!-- =========================
             REGISTER
        ========================== -->

        <div
            id="registerForm"
            style="display:none;">

            <div class="form-group">

                <label for="registerName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your name"
                    required>

            </div>


            <div class="form-group">

                <label for="registerEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create password"
                    required>

            </div>


            <div class="form-group">

                <label for="registerConfirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="registerConfirmPassword"
                    placeholder="Confirm password"
                    required>

            </div>


            <button
                class="btn btn-secondary"
                onclick="register()">
                Register
            </button>


            <div class="toggle-text">

                Already have an account?

                <a onclick="showLogin()">
                    Login here
                </a>

            </div>

        </div>


        <!-- =========================
             MESSAGES
        ========================== -->

        <div
            class="error-msg"
            id="errorMsg">
        </div>


        <div
            class="success-msg"
            id="successMsg">
        </div>

    </div>

</div>


<script
    type="module"
    src="login.js">
</script>

</body>
</html>
