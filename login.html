<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.login-box{
    background:white;
    padding:35px;
    border-radius:15px;
    width:350px;
}

.login-box h2{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;
    margin-top:5px;
    cursor:pointer;
}

#error{
    color:red;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="login-box">

    <h2>Snack Store Login</h2>

    <input
        id="email"
        type="email"
        placeholder="Email"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <button id="loginBtn">
        Login
    </button>

    <button id="registerBtn">
        Register
    </button>

    <div id="error"></div>

</div>

<script type="module">

import { auth } from "./firebase.js";

import {
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

// BLOCK file://
if (window.location.protocol === "file:") {

    document.body.innerHTML = `
        <div style="padding:20px;font-family:Arial;">
            <h2>Use GitHub Pages or Live Server</h2>
        </div>
    `;

    throw new Error("file:// blocked");
}

// AUTO REDIRECT
onAuthStateChanged(auth, (user) => {

    if (user) {
        window.location.href =
            "index.html";
    }
});

// LOGIN
async function login() {

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    } catch (error) {

        document.getElementById("error")
        .textContent =
            error.message;
    }
}

// REGISTER
async function register() {

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    try {

        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );

        alert("Account created!");

    } catch (error) {

        document.getElementById("error")
        .textContent =
            error.message;
    }
}

// EVENTS
document
.getElementById("loginBtn")
.addEventListener(
    "click",
    login
);

document
.getElementById("registerBtn")
.addEventListener(
    "click",
    register
);

</script>

</body>
</html>
