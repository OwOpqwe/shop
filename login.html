<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Snack Store</title>

<link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h2 id="formTitle">🏪 Login to Snack Store</h2>

        <!-- LOGIN FORM -->
        <div id="loginForm">

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password">
            </div>

            <button class="btn" onclick="login()">
                Login
            </button>

            <div class="toggle-text">
                Don't have an account?
                <a onclick="showRegister()">Register here</a>
            </div>

        </div>

        <!-- REGISTER FORM -->
        <div id="registerForm" style="display:none;">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="registerName" placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="registerEmail" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="registerPassword" placeholder="Create password">
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password">
            </div>

            <button class="btn btn-register" onclick="register()">
                Register
            </button>

            <div class="toggle-text">
                Already have an account?
                <a onclick="showLogin()">Login here</a>
            </div>

        </div>

        <div class="message error" id="errorMsg"></div>
        <div class="message success" id="successMsg"></div>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
