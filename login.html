<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Snack Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#0a0a0a,#1a1a2e);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:400px;
    max-width:100%;
    background:white;
    padding:40px;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

h2{
    text-align:center;
    margin-bottom:30px;
    color:#222;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#333;
}

.form-group input{
    width:100%;
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    font-size:1em;
}

.form-group input:focus{
    outline:none;
    border-color:#007bff;
}

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    font-size:1em;
    font-weight:bold;
    cursor:pointer;
    color:white;
    background:#007bff;
    transition:0.2s;
}

.btn:hover{
    background:#0056b3;
}

.btn-register{
    background:#28a745;
}

.btn-register:hover{
    background:#1e7e34;
}

.toggle{
    text-align:center;
    margin-top:20px;
    color:#666;
}

.toggle a{
    color:#007bff;
    cursor:pointer;
    text-decoration:underline;
}

.message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
    display:none;
}

.error{
    color:red;
}

.success{
    color:green;
}
</style>
</head>

<body>

<div class="login-box">

    <h2 id="title">🏪 Login to Snack Store</h2>

    <!-- LOGIN FORM -->
    <div id="loginForm">

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password">
        </div>

        <button class="btn" onclick="login()">Login</button>

        <div class="toggle">
            Don't have an account?
            <a onclick="showRegister()">Register here</a>
        </div>

    </div>

    <!-- REGISTER FORM -->
    <div id="registerForm" style="display:none;">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="registerName" placeholder="Enter your full name">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="registerEmail" placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="registerPassword" placeholder="Create a password">
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password">
        </div>

        <button class="btn btn-register" onclick="register()">Register</button>

        <div class="toggle">
            Already have an account?
            <a onclick="showLogin()">Login here</a>
        </div>

    </div>

    <div class="message error" id="errorMsg"></div>
    <div class="message success" id="successMsg"></div>

</div>

<script>

// Redirect if already logged in
if(localStorage.getItem("currentUser")){
    window.location.href = "index.html";
}

// Show Login Form
function showLogin(){
    document.getElementById("loginForm").style.display = "block";
    document.getElementById("registerForm").style.display = "none";
    document.getElementById("title").innerText = "🏪 Login to Snack Store";
    hideMessages();
}

// Show Register Form
function showRegister(){
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("registerForm").style.display = "block";
    document.getElementById("title").innerText = "🏪 Register for Snack Store";
    hideMessages();
}

// Hide Messages
function hideMessages(){
    document.getElementById("errorMsg").style.display = "none";
    document.getElementById("successMsg").style.display = "none";
}

// Show Error
function showError(message){
    var error = document.getElementById("errorMsg");
    error.innerText = message;
    error.style.display = "block";

    document.getElementById("successMsg").style.display = "none";
}

// Show Success
function showSuccess(message){
    var success = document.getElementById("successMsg");
    success.innerText = message;
    success.style.display = "block";

    document.getElementById("errorMsg").style.display = "none";
}

// REGISTER
function register(){

    var name = document.getElementById("registerName").value.trim();
    var email = document.getElementById("registerEmail").value.trim();
    var password = document.getElementById("registerPassword").value;
    var confirm = document.getElementById("confirmPassword").value;

    if(!name || !email || !password || !confirm){
        showError("Please fill in all fields");
        return;
    }

    if(password.length < 6){
        showError("Password must be at least 6 characters");
        return;
    }

    if(password !== confirm){
        showError("Passwords do not match");
        return;
    }

    var users = JSON.parse(localStorage.getItem("users") || "[]");

    var exists = users.find(function(user){
        return user.email === email;
    });

    if(exists){
        showError("Email already registered");
        return;
    }

    var newUser = {
        name:name,
        email:email,
        password:password
    };

    users.push(newUser);

    localStorage.setItem("users", JSON.stringify(users));

    showSuccess("Registration successful!");

    document.getElementById("registerName").value = "";
    document.getElementById("registerEmail").value = "";
    document.getElementById("registerPassword").value = "";
    document.getElementById("confirmPassword").value = "";

    setTimeout(function(){
        showLogin();
    },1500);
}

// LOGIN
function login(){

    var email = document.getElementById("loginEmail").value.trim();
    var password = document.getElementById("loginPassword").value;

    if(!email || !password){
        showError("Please enter email and password");
        return;
    }

    var users = JSON.parse(localStorage.getItem("users") || "[]");

    var user = users.find(function(u){
        return u.email === email && u.password === password;
    });

    if(!user){
        showError("Invalid email or password");
        return;
    }

    localStorage.setItem("currentUser", JSON.stringify(user));

    showSuccess("Login successful!");

    setTimeout(function(){
        window.location.href = "index.html";
    },1000);
}

</script>

</body>
</html>
