<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Snack Store</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

.login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.login-box {
    background: #fff;
    padding: 40px;
    border-radius: 15px;
    width: 400px;
    max-width: 100%;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}

.login-box h2 {
    color: #333;
    text-align: center;
    margin-bottom: 30px;
    font-size: 1.8em;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    color: #333;
    font-weight: bold;
    margin-bottom: 8px;
}

.form-group input {
    width: 100%;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 1em;
}

.form-group input:focus {
    outline: none;
    border-color: #007bff;
}

.btn {
    width: 100%;
    padding: 15px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1.1em;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

.btn:hover {
    background: #0056b3;
}

.btn:disabled {
    background: #ccc;
    cursor: not-allowed;
}

.btn-secondary {
    background: #28a745;
}

.btn-secondary:hover {
    background: #1e7e34;
}

.toggle-text {
    text-align: center;
    margin-top: 20px;
    color: #666;
}

.toggle-text a {
    color: #007bff;
    cursor: pointer;
    text-decoration: underline;
}

.error-msg {
    color: red;
    text-align: center;
    margin-top: 10px;
    display: none;
}

.success-msg {
    color: green;
    text-align: center;
    margin-top: 10px;
    display: none;
}

.info-msg {
    background: #e7f3ff;
    color: #004085;
    padding: 10px;
    border-radius: 5px;
    margin-bottom: 15px;
    text-align: center;
    font-size: 0.9em;
}
</style>
</head>
<body>

<div class="login-container">
    <div class="login-box">
        <h2 id="formTitle">🏪 Login to Snack Store</h2>
        
        <!-- LOGIN FORM -->
        <div id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required>
            </div>
            
            <button class="btn" onclick="login()">Login</button>
            
            <div class="toggle-text">
                Don't have an account? <a onclick="showRegister()">Register here</a>
            </div>
        </div>
        
        <!-- REGISTER FORM - Step 1 -->
        <div id="registerForm" style="display:none;">
            <div class="info-msg">
                ✉️ We'll send a verification code to your email
            </div>
            
            <div class="form-group">
                <label for="registerName">Full Name</label>
                <input type="text" id="registerName" placeholder="Enter your name" required>
            </div>
            
            <div class="form-group">
                <label for="registerEmail">Email</label>
                <input type="email" id="registerEmail" placeholder="Enter your real email" required>
            </div>
            
            <div class="form-group">
                <label for="registerPassword">Password</label>
                <input type="password" id="registerPassword" placeholder="Create a password (min 6 characters)" required>
            </div>
            
            <div class="form-group">
                <label for="registerConfirmPassword">Confirm Password</label>
                <input type="password" id="registerConfirmPassword" placeholder="Confirm your password" required>
            </div>
            
            <button class="btn btn-secondary" id="sendCodeBtn" onclick="sendVerificationCode()">Send Verification Code</button>
            
            <div class="toggle-text">
                Already have an account? <a onclick="showLogin()">Login here</a>
            </div>
        </div>
        
        <!-- VERIFICATION FORM - Step 2 -->
        <div id="verificationForm" style="display:none;">
            <div class="info-msg">
                ✉️ Check your email for the verification code
            </div>
            
            <div class="form-group">
                <label for="verificationCode">Verification Code</label>
                <input type="text" id="verificationCode" placeholder="Enter 6-digit code" maxlength="6" required>
            </div>
            
            <button class="btn btn-secondary" onclick="verifyCode()">Verify & Complete Registration</button>
            
            <div class="toggle-text">
                <a onclick="showRegister()">← Back to registration</a>
            </div>
        </div>
        
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>
    </div>
</div>

<!-- Hidden iframe for email sending -->
<iframe name="emailFrame" style="display:none;"></iframe>

<!-- Hidden form for sending verification code -->
<form id="verificationEmailForm" action="https://formsubmit.co/ajax/PLACEHOLDER" method="POST" target="emailFrame" style="display:none;">
    <input type="hidden" name="_subject" value="Your Snack Store Verification Code">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="box">
    <input type="text" name="Verification Code" id="codeField">
    <input type="text" name="Name" id="nameField">
</form>

<script>
var tempUserData = null;
var sentVerificationCode = null;

// Show login form
function showLogin() {
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('registerForm').style.display = 'none';
    document.getElementById('verificationForm').style.display = 'none';
    document.getElementById('formTitle').textContent = '🏪 Login to Snack Store';
    hideMessages();
}

// Show register form
function showRegister() {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('registerForm').style.display = 'block';
    document.getElementById('verificationForm').style.display = 'none';
    document.getElementById('formTitle').textContent = '🏪 Register for Snack Store';
    hideMessages();
}

// Show verification form
function showVerification() {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('registerForm').style.display = 'none';
    document.getElementById('verificationForm').style.display = 'block';
    document.getElementById('formTitle').textContent = '✉️ Email Verification';
    hideMessages();
}

// Hide messages
function hideMessages() {
    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('successMsg').style.display = 'none';
}

// Show error message
function showError(message) {
    var errorMsg = document.getElementById('errorMsg');
    errorMsg.textContent = message;
    errorMsg.style.display = 'block';
    document.getElementById('successMsg').style.display = 'none';
}

// Show success message
function showSuccess(message) {
    var successMsg = document.getElementById('successMsg');
    successMsg.textContent = message;
    successMsg.style.display = 'block';
    document.getElementById('errorMsg').style.display = 'none';
}

// Validate email format
function isValidEmail(email) {
    var re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return re.test(email);
}

// Generate 6-digit verification code
function generateCode() {
    return Math.floor(100000 + Math.random() * 900000).toString();
}

// Send verification code
function sendVerificationCode() {
    var name = document.getElementById('registerName').value.trim();
    var email = document.getElementById('registerEmail').value.trim();
    var password = document.getElementById('registerPassword').value;
    var confirmPassword = document.getElementById('registerConfirmPassword').value;
    
    // Validation
    if (!name || !email || !password || !confirmPassword) {
        showError('Please fill in all fields');
        return;
    }
    
    if (!isValidEmail(email)) {
        showError('Please enter a valid email address');
        return;
    }
    
    if (password !== confirmPassword) {
        showError('Passwords do not match');
        return;
    }
    
    if (password.length < 6) {
        showError('Password must be at least 6 characters');
        return;
    }
    
    // Check if email already exists
    var users = JSON.parse(localStorage.getItem('users') || '[]');
    var existingUser = users.find(function(user) {
        return user.email === email;
    });
    
    if (existingUser) {
        showError('Email already registered');
        return;
    }
    
    // Generate verification code
    sentVerificationCode = generateCode();
    
    // Store temporary user data
    tempUserData = {
        name: name,
        email: email,
        password: password
    };
    
    // Send email via FormSubmit
    document.getElementById('verificationEmailForm').action = 'https://formsubmit.co/' + email;
    document.getElementById('codeField').value = 'Your verification code is: ' + sentVerificationCode;
    document.getElementById('nameField').value = name;
    
    // Disable button
    document.getElementById('sendCodeBtn').disabled = true;
    document.getElementById('sendCodeBtn').textContent = 'Sending...';
    
    document.getElementById('verificationEmailForm').submit();
    
    // Show success and move to verification
    setTimeout(function() {
        showSuccess('Verification code sent to ' + email);
        setTimeout(function() {
            showVerification();
        }, 1500);
    }, 1000);
    
    // Re-enable button
    setTimeout(function() {
        document.getElementById('sendCodeBtn').disabled = false;
        document.getElementById('sendCodeBtn').textContent = 'Send Verification Code';
    }, 3000);
}

// Verify code and complete registration
function verifyCode() {
    var enteredCode = document.getElementById('verificationCode').value.trim();
    
    if (!enteredCode) {
        showError('Please enter the verification code');
        return;
    }
    
    if (enteredCode !== sentVerificationCode) {
        showError('Invalid verification code. Please check your email.');
        return;
    }
    
    // Code is correct - complete registration
    var users = JSON.parse(localStorage.getItem('users') || '[]');
    users.push({
        name: tempUserData.name,
        email: tempUserData.email,
        password: tempUserData.password,
        verified: true
    });
    
    localStorage.setItem('users', JSON.stringify(users));
    
    showSuccess('✅ Email verified! Registration complete. You can now login.');
    
    // Clear forms
    document.getElementById('registerName').value = '';
    document.getElementById('registerEmail').value = '';
    document.getElementById('registerPassword').value = '';
    document.getElementById('registerConfirmPassword').value = '';
    document.getElementById('verificationCode').value = '';
    
    tempUserData = null;
    sentVerificationCode = null;
    
    // Show login form after 2 seconds
    setTimeout(function() {
        showLogin();
    }, 2000);
}

// Login user
function login() {
    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    
    if (!email || !password) {
        showError('Please enter email and password');
        return;
    }
    
    var users = JSON.parse(localStorage.getItem('users') || '[]');
    var user = users.find(function(u) {
        return u.email === email && u.password === password;
    });
    
    if (!user) {
        showError('Invalid email or password');
        return;
    }
    
    if (!user.verified) {
        showError('Please verify your email first');
        return;
    }
    
    localStorage.setItem('currentUser', JSON.stringify(user));
    
    showSuccess('Login successful! Redirecting...');
    
    setTimeout(function() {
        window.location.href = 'index.html';
    }, 1000);
}

// Check if already logged in
var currentUser = localStorage.getItem('currentUser');
if (currentUser) {
    window.location.href = 'index.html';
}
</script>
</body>
</html>
