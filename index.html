<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snack Store</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        /* =========================
           PRODUCT IMAGE SIZE
        ========================= */

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
        }

        /* Bundle image slightly larger */

        .product-card:nth-child(3) img {
            height: 220px;
        }


        /* =========================
           THREE-LINE MENU
        ========================= */

        .menu-container {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
        }

        .menu-button {
            background: #222;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 24px;
            padding: 8px 12px;
            cursor: pointer;
        }

        .menu-button:hover {
            background: #333;
        }

        .menu-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 48px;
            width: 190px;
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .menu-dropdown.show {
            display: block;
        }

        .menu-dropdown button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #222;
            color: white;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
        }

        .menu-dropdown button:hover {
            background: #333;
        }

        #adminDashboardMenu {
            background: #6f42c1;
        }

        #adminDashboardMenu:hover {
            background: #59339d;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .product-card img {
                height: 140px;
            }

            .product-card:nth-child(3) img {
                height: 160px;
            }

        }
    </style>
</head>


<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <h1>Snack Store</h1>

        <h2>CASH ONLY</h2>


        <!-- THREE-LINE MENU -->

        <div class="menu-container">

            <button
                class="menu-button"
                onclick="toggleMenu()">
                ☰
            </button>


            <div
                id="menuDropdown"
                class="menu-dropdown">

                <!-- Admin Dashboard -->

                <button
                    id="adminDashboardMenu"
                    onclick="goToAdminDashboard(); closeMenu();"
                    style="display:none;">
                    🛡️ Admin Dashboard
                </button>


                <!-- Order History -->

                <button
                    onclick="toggleOrderHistory(); closeMenu();">
                    📦 Order History
                </button>


                <!-- Logout -->

                <button
                    onclick="logout(); closeMenu();">
                    🚪 Logout
                </button>

            </div>

        </div>


        <!-- USER INFO -->

        <div id="userInfo" style="display:none;">

            Welcome,
            <span id="userName"></span>

        </div>

    </header>


    <!-- =========================
         PRODUCTS
    ========================= -->

    <main>

        <section class="products">


            <!-- DR PEPPER -->

            <div class="product-card">

                <img
                    src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/Dr_Pepper_Dose_2024.jpg/500px-Dr_Pepper_Dose_2024.jpg"
                    alt="Dr Pepper">

                <h3>Dr Pepper</h3>

                <p>NT$30</p>

                <div class="product-actions">

                    <input
                        type="number"
                        id="qty-drpepper"
                        value="1"
                        min="1">

                    <button
                        onclick="addToCart('Dr Pepper', 30, 'qty-drpepper')">
                        Add
                    </button>

                </div>

            </div>


            <!-- CHICKEN NOODLE SNACK -->

            <div class="product-card">

                <img
                    src="https://images.cdn.saveonfoods.com/detail/00074410700799.jpg"
                    alt="Chicken Noodle Snack">

                <h3>Chicken Noodle Snack</h3>

                <p>NT$25</p>

                <div class="product-actions">

                    <input
                        type="number"
                        id="qty-noodle"
                        value="1"
                        min="1">

                    <button
                        onclick="addToCart('Chicken Noodle Snack', 25, 'qty-noodle')">
                        Add
                    </button>

                </div>

            </div>


            <!-- BUNDLE PACK -->

            <div class="product-card">

                <img
                    src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/Dr_Pepper_Dose_2024.jpg/500px-Dr_Pepper_Dose_2024.jpg"
                    alt="Bundle Pack">

                <h3>Bundle Pack</h3>

                <p>1 Dr Pepper + 1 Chicken Noodle Snack</p>

                <p>NT$50</p>

                <div class="product-actions">

                    <input
                        type="number"
                        id="qty-bundle"
                        value="1"
                        min="1">

                    <button
                        onclick="addToCart('Bundle Pack', 50, 'qty-bundle')">
                        Add
                    </button>

                </div>

            </div>


            <!-- CHOCOLATE -->

            <div class="product-card">

                <img
                    src="https://i.ebayimg.com/images/g/WboAAOSwPhBoI-cE/s-l1200.jpg"
                    alt="Chocolate">

                <h3>Chocolate</h3>

                <p>NT$20</p>

                <div class="product-actions">

                    <input
                        type="number"
                        id="qty-chocolate"
                        value="1"
                        min="1">

                    <button
                        onclick="addToCart('Chocolate', 20, 'qty-chocolate')">
                        Add
                    </button>

                </div>

            </div>

        </section>


        <!-- =========================
             CART
        ========================= -->

        <aside class="cart">

            <h2>🛒 Cart</h2>

            <div id="cart-items">
                Your cart is empty.
            </div>

            <h3>
                Total:
                NT$<span id="cart-total">0</span>
            </h3>


            <label for="customerName">
                Your Name
            </label>

            <input
                type="text"
                id="customerName"
                readonly>


            <button
                onclick="checkout()">
                Checkout
            </button>

        </aside>


        <!-- =========================
             ORDER HISTORY
        ========================= -->

        <section
            id="order-history"
            style="display:none;">

            <h2>Order History</h2>

            <div id="history-list">
                Loading...
            </div>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script type="module" src="script.js"></script>


    <script>

        function toggleMenu() {

            const menu =
                document.getElementById(
                    "menuDropdown"
                );

            if (!menu) return;

            menu.classList.toggle("show");

        }


        function closeMenu() {

            const menu =
                document.getElementById(
                    "menuDropdown"
                );

            if (!menu) return;

            menu.classList.remove("show");

        }


        /* Close menu when clicking outside */

        document.addEventListener(
            "click",
            function(event) {

                const container =
                    document.querySelector(
                        ".menu-container"
                    );

                if (
                    container &&
                    !container.contains(
                        event.target
                    )
                ) {

                    closeMenu();

                }

            }
        );

    </script>

</body>

</html>
