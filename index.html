<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snack Store</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <h1>🍿 Snack Store</h1>
    <div class="cash-only">💵 Cash Only</div>
</header>

<button class="menu-button" onclick="toggleMenu()" aria-label="Open menu">
    ☰
</button>

<div id="menu" class="menu">

    <button
        id="adminDashboardMenu"
        style="display: none;"
        onclick="goToAdminDashboard(); closeMenu();">
        🛡️ Admin Dashboard
    </button>

    <button onclick="toggleOrderHistory(); closeMenu();">
        📋 Order History
    </button>

    <button onclick="logout();">
        🚪 Logout
    </button>

</div>

<main>

    <section id="userInfo">

        <h2>Welcome, <span id="userName">Customer</span>!</h2>

        <label for="customerName">
            Customer Name
        </label>

        <input
            type="text"
            id="customerName"
            readonly>

    </section>

    <div class="store-layout">

        <section class="products">

            <div class="product-card">

                <img
                    src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/Dr_Pepper_Dose_2024.jpg/500px-Dr_Pepper_Dose_2024.jpg"
                    alt="Dr Pepper">

                <h2>Dr Pepper</h2>

                <p class="price">NT$30</p>

                <div class="product-actions">

                    <input
                        type="number"
                        id="qty-dr-pepper"
                        value="1"
                        min="1">

                    <button
                        onclick="addToCart('Dr Pepper', 30, 'qty-dr-pepper')">
                        Add
                    </button>

                </div>

            </div>

            <div class="product-card">

                <img
                    src="https://images.cdn.saveonfoods.com/detail/00074410700799.jpg"
                    alt="Chicken Noodle Snack">

                <h2>Chicken Noodle Snack</h2>

                <p class="price">NT$25</p>

                <div class="product-actions">

                    <input
                        type="number"
                        id="qty-chicken"
                        value="1"
                        min="1">

                    <button
                        onclick="addToCart('Chicken Noodle Snack', 25, 'qty-chicken')">
                        Add
                    </button>

                </div>

            </div>

            <div class="product-card">

                <img
                    src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/Dr_Pepper_Dose_2024.jpg/500px-Dr_Pepper_Dose_2024.jpg"
                    alt="Bundle Pack">

                <h2>Bundle Pack</h2>

                <p>1 Dr Pepper + 1 Chicken Noodle Snack</p>

                <p class="price">NT$50</p>

                <div class="product-actions">

                    <input
                        type="number"
                        id="qty-bundle"
                        value="1"
                        min="1">

                    <button
                        onclick="addToCart('Bundle Pack', 50, 'qty-bundle')">
                        Add
                    </button>

                </div>

            </div>

            <div class="product-card">

                <img
                    src="https://i.ebayimg.com/images/g/WboAAOSwPhBoI-cE/s-l1200.jpg"
                    alt="Chocolate">

                <h2>Chocolate</h2>

                <p class="price">NT$20</p>

                <div class="product-actions">

                    <input
                        type="number"
                        id="qty-chocolate"
                        value="1"
                        min="1">

                    <button
                        onclick="addToCart('Chocolate', 20, 'qty-chocolate')">
                        Add
                    </button>

                </div>

            </div>

        </section>

        <section id="cart">

            <h2>🛒 Cart</h2>

            <div id="cart-items">
                Your cart is empty.
            </div>

            <div>
                Total:
                <span id="cart-total">0</span>
                NT$
            </div>

            <br>

            <button onclick="checkout()">
                💵 Checkout
            </button>

        </section>

    </div>

    <section id="order-history" style="display: none;">

        <h2>📋 Order History</h2>

        <div id="history-list">
            Loading order history...
        </div>

    </section>

</main>

<script>
function toggleMenu() {
    const menu = document.getElementById("menu");

    if (!menu) return;

    if (menu.style.display === "block") {
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }
}

function closeMenu() {
    const menu = document.getElementById("menu");

    if (menu) {
        menu.style.display = "none";
    }
}
</script>

<script type="module" src="script.js"></script>

</body>
</html>
