<!DOCTYPE html>
<html>
<head>
    <title>Snack Store</title>
</head>
<body>

<!-- USER INFO -->
<div id="userInfo" style="display:none;">
    Logged in as: <span id="userName"></span>
    <button onclick="logout()">Logout</button>
</div>

<!-- PRODUCTS EXAMPLE -->
<div>
    <input id="input-DrPepper" type="number" value="1">
    <button onclick="addToCartWithInput('DrPepper', 3)">Add Dr Pepper</button>
    <span id="qty-DrPepper">0</span>
</div>

<!-- CART -->
<h3>Cart</h3>
<div id="cart-items"></div>
<p>Total: NT$<span id="total">0</span></p>

<button onclick="checkout()">Checkout</button>

<!-- ORDER FORM (IMPORTANT) -->
<form id="orderForm" action="YOUR_EMAIL_SERVICE" method="POST">
    <input type="hidden" id="emailSubject" name="subject">
    <input type="hidden" id="customerNameField" name="name">
    <textarea id="orderDetails" name="message"></textarea>
    <input type="hidden" id="orderTotal" name="total">
</form>

<!-- SCRIPTS -->
<script type="module" src="./script.js"></script>

</body>
</html>
