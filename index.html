
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Snack Store</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- USER INFO -->
<div id="userInfo" style="display:none;">
    <span>Welcome, <span id="userName"></span>!</span>
    <button onclick="logout()">Logout</button>
</div>

<header>
    Snack Store <span class="cash-only">CASH ONLY</span>
</header>

<div class="main-container">

    <!-- STORE -->
    <div class="store-container">

        <!-- DR PEPPER -->
        <div class="item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/Dr_Pepper_Dose_2024.jpg/250px-Dr_Pepper_Dose_2024.jpg">
            <h3>Dr Pepper</h3>
            <p>NT$30</p>

            <div class="quantity">
                <input type="number" id="input-DrPepper" value="1" min="1">
                <button class="add-btn" onclick="addToCartWithInput('Dr Pepper',30)">Add</button>
            </div>

            <div>In cart: <span id="qty-DrPepper">0</span></div>
        </div>

        <!-- CHICKEN -->
        <div class="item">
            <img src="https://images.cdn.saveonfoods.com/detail/00074410700799.jpg">
            <h3>Chicken Noodle Snack</h3>
            <p>NT$25</p>

            <div class="quantity">
                <input type="number" id="input-ChickenNoodleSnack" value="1" min="1">
                <button class="add-btn" onclick="addToCartWithInput('Chicken Noodle Snack',25)">Add</button>
            </div>

            <div>In cart: <span id="qty-ChickenNoodleSnack">0</span></div>
        </div>

        <!-- BUNDLE -->
        <div class="item">
            <h3>Bundle Pack</h3>
            <p>NT$50</p>

            <div class="quantity">
                <input type="number" id="input-BundlePack" value="1" min="1">
                <button class="add-btn" onclick="addToCartWithInput('Bundle Pack',50)">Add</button>
            </div>

            <div>In cart: <span id="qty-BundlePack">0</span></div>
        </div>

        <!-- CHOCOLATE -->
        <div class="item">
            <img src="https://i.ebayimg.com/images/g/WboAAOSwPhBoI-cE/s-l1200.jpg">
            <h3>Chocolate</h3>
            <p>NT$20</p>

            <div class="quantity">
                <input type="number" id="input-Chocolate" value="1" min="1">
                <button class="add-btn" onclick="addToCartWithInput('Chocolate',20)">Add</button>
            </div>

            <div>In cart: <span id="qty-Chocolate">0</span></div>
        </div>

    </div>

    <!-- CART -->
    <div class="cart-panel">

        <div class="cart-header">Your Cart</div>

        <input id="customerName" readonly>

        <div id="cart-items"></div>

        <div class="cart-total">
            Total: NT$<span id="total">0</span>
        </div>

        <button class="checkout-btn" onclick="checkout()">Checkout</button>

        <button onclick="toggleOrderHistory()">View Order History</button>

        <div id="order-history" style="display:none;">
            <h3>Order History</h3>
            <div id="history-list"></div>
        </div>

    </div>
</div>

<iframe name="hiddenFrame" style="display:none;"></iframe>

<script type="module" src="script.js"></script>

</body>
</html>
