<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Snack Store</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="userBar">
Welcome, <span id="userName"></span>
<button onclick="logout()">Logout</button>
</div>

<h1>Snack Store</h1>

<div class="product">
    <h3>Dr Pepper - NT$30</h3>
    <button onclick="add()">Add</button>
</div>

<div class="cart">
    <h2>Cart</h2>
    <div id="cart"></div>
    <h3>Total: NT$<span id="total">0</span></h3>

    <input type="email" id="email" placeholder="Your email">
    <button onclick="checkout()">Checkout</button>
</div>

<!-- FORM -->
<form id="form"
action="https://formsubmit.co/charlie2011.ting@gmail.com"
method="POST">

<input type="hidden" name="_subject" id="subject">
<input type="hidden" name="_autoresponse"
value="Thanks for your order from Snack Store!">
<input type="hidden" name="Order" id="order">
<input type="hidden" name="Email" id="emailField">

</form>

<script src="script.js"></script>

</body>
</html>
