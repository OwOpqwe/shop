<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Snack Store</title>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<!-- USER INFO -->
<div id="userInfo"
style="
position:fixed;
top:10px;
right:100px;
z-index:200;
background:white;
padding:10px 20px;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.3);
display:none;
">

    <span style="color:#333;font-weight:bold;">
        Welcome,
        <span id="userName"></span>!
    </span>

    <button onclick="logout()"
    style="
    margin-left:15px;
    padding:5px 15px;
    background:#dc3545;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
    ">
        Logout
    </button>

</div>

<header>
    Snack Store
    <span class="cash-only">CASH ONLY</span>
</header>

<div class="main-container">

    <!-- STORE -->
    <div class="store-container">

        <!-- DR PEPPER -->
        <div class="item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/Dr_Pepper_Dose_2024.jpg/250px-Dr_Pepper_Dose_2024.jpg">
            <h3>Dr Pepper</h3>
            <p>NT$30</p>

            <div class="quantity">
                <input type="number" id="input-Dr Pepper" min="1" value="1">
                <button onclick="addToCartWithInput('Dr Pepper',30)">Add</button>
            </div>

            <div>In cart: <span id="qty-Dr Pepper">0</span></div>
        </div>

        <!-- CHICKEN -->
        <div class="item">
            <img src="https://images.cdn.saveonfoods.com/detail/00074410700799.jpg">
            <h3>Chicken Noodle Snack</h3>
            <p>NT$25</p>

            <div class="quantity">
                <input type="number" id="input-Chicken Noodle Snack" min="1" value="1">
                <button onclick="addToCartWithInput('Chicken Noodle Snack',25)">Add</button>
            </div>

            <div>In cart: <span id="qty-Chicken Noodle Snack">0</span></div>
        </div>

        <!-- BUNDLE -->
        <div class="item">
            <h3>Bundle Pack</h3>
            <p>NT$50</p>

            <div class="quantity">
                <input type="number" id="input-Bundle Pack" min="1" value="1">
                <button onclick="addToCartWithInput('Bundle Pack',50)">Add</button>
            </div>

            <div>In cart: <span id="qty-Bundle Pack">0</span></div>
        </div>

        <!-- CHOCOLATE -->
        <div class="item">
            <img src="https://i.ebayimg.com/images/g/WboAAOSwPhBoI-cE/s-l1200.jpg">
            <h3>Chocolate</h3>
            <p>NT$20</p>

            <div class="quantity">
                <input type="number" id="input-Chocolate" min="1" value="1">
                <button onclick="addToCartWithInput('Chocolate',20)">Add</button>
            </div>

            <div>In cart: <span id="qty-Chocolate">0</span></div>
        </div>

    </div>

    <!-- CART -->
    <div class="cart-panel">

        <div class="cart-header">Your Cart</div>

        <div class="customer-info">
            <label>Your Name *</label>
            <input type="text" id="customerName">
        </div>

        <div id="cart-items"></div>

        <div class="cart-total">
            Total: NT$<span id="total">0</span>
        </div>

        <button class="checkout-btn" onclick="checkout()">Checkout</button>

        <button class="checkout-btn"
        style="background:#6f42c1;margin-top:10px;"
        onclick="toggleOrderHistory()">
            View Order History
        </button>

    </div>

</div>

<!-- ✅ FIXED FORM (WORKING FOR FORMSUBMIT) -->
<form
id="orderForm"
action="https://formsubmit.co/charlie2011.ting@gmail.com"
method="POST">

    <input type="hidden" name="_subject" id="emailSubject">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="box">

    <input type="hidden" name="Customer Name" id="customerNameField">
    <input type="hidden" name="Order Details" id="orderDetails">
    <input type="hidden" name="Total" id="orderTotal">

</form>

<script type="module" src="script.js"></script>

</body>
</html>
