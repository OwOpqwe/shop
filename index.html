<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snack Store</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- USER INFO -->
<div id="userInfo">
    Logged in as:
    <span id="userName"></span>

    <button id="logoutBtn">
        Logout
    </button>
</div>

<header>
    Snack Store
</header>

<div class="main-container">

    <!-- PRODUCTS -->
    <div class="store-container">

        <!-- DR PEPPER -->
        <div class="item">

            <img
                src="https://upload.wikimedia.org/wikipedia/commons/0/0e/Dr_Pepper_can.jpg"
                alt="Dr Pepper"
            >

            <h3>Dr Pepper</h3>

            <p>NT$3</p>

            <div class="quantity">

                <input
                    id="input-DrPepper"
                    type="number"
                    min="1"
                    value="1"
                >

                <button
                    class="add-btn"
                    data-id="DrPepper"
                    data-price="3"
                >
                    Add
                </button>

            </div>

            <div class="cart-counter">
                Qty:
                <span id="qty-DrPepper">0</span>
            </div>

        </div>

        <!-- CHICKEN NOODLES -->
        <div class="item">

            <img
                src="https://upload.wikimedia.org/wikipedia/commons/5/59/Cup_noodle.jpg"
                alt="Chicken Noodles"
            >

            <h3>Chicken Noodles</h3>

            <p>NT$5</p>

            <div class="quantity">

                <input
                    id="input-ChickenNoodles"
                    type="number"
                    min="1"
                    value="1"
                >

                <button
                    class="add-btn"
                    data-id="ChickenNoodles"
                    data-price="5"
                >
                    Add
                </button>

            </div>

            <div class="cart-counter">
                Qty:
                <span id="qty-ChickenNoodles">0</span>
            </div>

        </div>

        <!-- COKE ZERO -->
        <div class="item">

            <img
                src="https://upload.wikimedia.org/wikipedia/commons/1/1f/Coca-Cola_Zero_Sugar_2021.jpg"
                alt="Coke Zero"
            >

            <h3>Coke Zero</h3>

            <p>NT$2</p>

            <div class="quantity">

                <input
                    id="input-CokeZero"
                    type="number"
                    min="1"
                    value="1"
                >

                <button
                    class="add-btn"
                    data-id="CokeZero"
                    data-price="2"
                >
                    Add
                </button>

            </div>

            <div class="cart-counter">
                Qty:
                <span id="qty-CokeZero">0</span>
            </div>

        </div>

    </div>

    <!-- CART -->
    <aside class="cart-panel">

        <div class="cart-header">
            Cart
        </div>

        <div id="cart-items"></div>

        <div class="cart-total">
            Total:
            NT$<span id="total">0</span>
        </div>

        <button
            class="checkout-btn"
            id="checkoutBtn"
        >
            Checkout
        </button>

    </aside>

</div>

<script type="module" src="./script.js"></script>

</body>
</html>
