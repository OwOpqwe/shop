<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snack Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial; padding: 20px; }

.product {
    margin-bottom: 12px;
}

#cart-items {
    border: 1px solid #ccc;
    padding: 10px;
    margin-top: 10px;
}

button {
    margin-left: 10px;
}
</style>
</head>

<body>

<div id="userInfo" style="display:none;">
    Logged in as: <span id="userName"></span>
    <button onclick="logout()">Logout</button>
</div>

<hr>

<h2>Products</h2>

<div class="product">
    Dr Pepper ($3)
    <input id="input-DrPepper" type="number" value="1" min="1">
    <button onclick="addToCartWithInput('DrPepper', 3)">Add</button>
    <span id="qty-DrPepper">0</span>
</div>

<div class="product">
    Chicken Noodles ($5)
    <input id="input-ChickenNoodles" type="number" value="1" min="1">
    <button onclick="addToCartWithInput('ChickenNoodles', 5)">Add</button>
    <span id="qty-ChickenNoodles">0</span>
</div>

<div class="product">
    Coke Zero ($2)
    <input id="input-CokeZero" type="number" value="1" min="1">
    <button onclick="addToCartWithInput('CokeZero', 2)">Add</button>
    <span id="qty-CokeZero">0</span>
</div>

<hr>

<h2>Cart</h2>
<div id="cart-items"></div>

<h3>Total: NT$<span id="total">0</span></h3>

<button onclick="checkout()">Checkout</button>

<script type="module" src="./script.js"></script>

</body>
</html>
