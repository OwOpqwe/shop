<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snack Store</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="userInfo">
    <span>
        Welcome,
        <span id="userName"></span>
    </span>

    <button onclick="logout()">
        Logout
    </button>
</div>

<header>
    Snack Store
    <span class="cash-only">
        CASH ONLY
    </span>
</header>

<div class="main-container">

<div class="store-container">

<div class="item">
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/Dr_Pepper_Dose_2024.jpg/250px-Dr_Pepper_Dose_2024.jpg">
<h3>Dr Pepper</h3>
<p>NT$30</p>
<div class="quantity">
<input type="number" id="input-Dr Pepper" min="1" value="1">
<button class="add-btn" onclick="addToCartWithInput('Dr Pepper',30)">
Add
</button>
</div>
<div class="cart-counter">
In cart: <span id="qty-Dr Pepper">0</span>
</div>
</div>

<div class="item">
<img src="https://i.ebayimg.com/images/g/WboAAOSwPhBoI-cE/s-l1200.jpg">
<h3>Chocolate</h3>
<p>NT$20</p>
<div class="quantity">
<input type="number" id="input-Chocolate" min="1" value="1">
<button class="add-btn" onclick="addToCartWithInput('Chocolate',20)">
Add
</button>
</div>
<div class="cart-counter">
In cart: <span id="qty-Chocolate">0</span>
</div>
</div>

</div>

<div class="cart-panel">

<div class="cart-header">
Your Cart
</div>

<div class="customer-info">
<label>Your Name</label>
<input type="text" id="customerName" readonly>
</div>

<div id="cart-items"></div>

<div class="cart-total">
Total: NT$<span id="total">0</span>
</div>

<button class="checkout-btn" onclick="checkout()">
Checkout
</button>

<div id="order-history">
<button class="checkout-btn history-btn" onclick="toggleOrderHistory()">
Order History
</button>

<div id="history-list"></div>
</div>

</div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
