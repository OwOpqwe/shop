<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Snack Store</title>

<link rel="stylesheet" href="./style.css">

</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <div class="header-center">

        <h1>Snack Store</h1>

        <div class="cash-only">
            CASH ONLY
        </div>

    </div>

    <div id="userInfo">

        <span>
            Welcome,
            <span id="userName"></span>
        </span>

        <button onclick="logout()" id="logoutBtn">
            Logout
        </button>

    </div>

</header>

<!-- ================= MAIN ================= -->

<div class="main-container">

    <!-- ================= STORE ================= -->

    <div class="store-container">

        <!-- PRODUCT 1 -->

        <div class="item">

            <img
                src="https://upload.wikimedia.org/wikipedia/commons/0/0e/Dr_Pepper_can.jpg"
                alt="Dr Pepper"
            >

            <h3>Dr Pepper</h3>

            <p>NT$30</p>

            <div class="quantity">

                <input
                    id="input-DrPepper"
                    type="number"
                    min="1"
                    value="1"
                >

                <button
                    class="add-btn"
                    onclick="addToCartWithInput('DrPepper', 30)"
                >
                    Add
                </button>

            </div>

            <div class="cart-counter">
                In cart:
                <span id="qty-DrPepper">0</span>
            </div>

        </div>

        <!-- PRODUCT 2 -->

        <div class="item">

            <img
                src="https://upload.wikimedia.org/wikipedia/commons/5/59/Cup_noodle.jpg"
                alt="Chicken Noodles"
            >

            <h3>Chicken Noodles</h3>

            <p>NT$50</p>

            <div class="quantity">

                <input
                    id="input-ChickenNoodles"
                    type="number"
                    min="1"
                    value="1"
                >

                <button
                    class="add-btn"
                    onclick="addToCartWithInput('ChickenNoodles', 50)"
                >
                    Add
                </button>

            </div>

            <div class="cart-counter">
                In cart:
                <span id="qty-ChickenNoodles">0</span>
            </div>

        </div>

        <!-- PRODUCT 3 -->

        <div class="item">

            <img
                src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/31/Coca-Cola_Zero_Sugar_2021.svg/800px-Coca-Cola_Zero_Sugar_2021.svg.png"
                alt="Coke Zero"
            >

            <h3>Coke Zero</h3>

            <p>NT$20</p>

            <div class="quantity">

                <input
                    id="input-CokeZero"
                    type="number"
                    min="1"
                    value="1"
                >

                <button
                    class="add-btn"
                    onclick="addToCartWithInput('CokeZero', 20)"
                >
                    Add
                </button>

            </div>

            <div class="cart-counter">
                In cart:
                <span id="qty-CokeZero">0</span>
            </div>

        </div>

    </div>

    <!-- ================= CART ================= -->

    <aside class="cart-panel">

        <div class="cart-header">
            Your Cart
        </div>

        <div class="customer-info">

            <label>
                Your Name
            </label>

            <input
                type="text"
                id="customerName"
            >

        </div>

        <div id="cart-items"></div>

        <div class="cart-total">
            Total: NT$<span id="total">0</span>
        </div>

        <button
            class="checkout-btn"
            onclick="checkout()"
        >
            Checkout
        </button>

        <button
            class="history-btn"
            onclick="toggleOrderHistory()"
        >
            Order History
        </button>

        <div id="order-history"></div>

    </aside>

</div>

<!-- ================= EMAIL FORM ================= -->

<form
    id="orderForm"
    action="https://formsubmit.co/YOUR_EMAIL"
    method="POST"
    style="display:none;"
>

    <input
        type="hidden"
        id="emailSubject"
        name="subject"
    >

    <input
        type="hidden"
        id="customerNameField"
        name="name"
    >

    <textarea
        id="orderDetails"
        name="message"
    ></textarea>

    <input
        type="hidden"
        id="orderTotal"
        name="total"
    >

</form>

<!-- ================= SCRIPT ================= -->

<script type="module" src="./script.js"></script>

</body>
</html>
