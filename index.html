<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snack Store</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        /* =========================
           TOP MENU
        ========================= */

        .menu-container {
            position: relative;
            display: inline-block;
        }

        .menu-button {
            background: #222;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
        }

        .menu-button:hover {
            background: #333;
        }

        .menu-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 50px;
            background: #222;
            min-width: 190px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            z-index: 9999;
        }

        .menu-dropdown.show {
            display: block;
        }

        .menu-dropdown button {
            width: 100%;
            display: block;
            background: #222;
            color: white;
            border: none;
            padding: 14px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
        }

        .menu-dropdown button:hover {
            background: #333;
        }

        .admin-menu-item {
            background: #6f42c1 !important;
        }

        .admin-menu-item:hover {
            background: #59339d !important;
        }

        /* Keep menu in the top-right */
        header {
            position: relative;
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <div>
            <h1>Snack Store</h1>
            <h2>CASH ONLY</h2>
        </div>

        <!-- THREE-LINE MENU -->

        <div class="menu-container">

            <button
                id="menuButton"
                class="menu-button"
                onclick="toggleMenu()"
                aria-label="Open menu">
                ☰
            </button>

            <div
                id="menuDropdown"
                class="menu-dropdown">

                <!-- Admin Dashboard -->
                <!-- Hidden unless user is an admin -->

                <button
                    id="adminDashboardMenu"
                    class="admin-menu-item"
                    onclick="goToAdminDashboard()"
                    style="display: none;">
                    🛡️ Admin Dashboard
                </button>

                <!-- Order History -->

                <button onclick="toggleOrderHistory(); closeMenu();">
                    📦 Order History
                </button>

                <!-- Logout -->

                <button onclick="logout(); closeMenu();">
                    🚪 Logout
                </button>

            </div>

        </div>

    </header>


    <!-- =========================
         USER INFORMATION
    ========================= -->

    <div id="userInfo" style="display:none;">

        Welcome,
        <span id="userName"></span>

    </div>


    <!-- =========================
         PRODUCTS
    ========================= -->

    <main>

        <section class="products">

            <!-- DR PEPPER -->

            <div class="product-card">

                <img
                    src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/Dr_Pepper_Dose_2024.jpg/500px-Dr_Pepper_Dose_2024.jpg"
                    alt="Dr Pepper">

                <h3>Dr Pepper</h3>

                <p>NT$30</p>

                <div class="product-actions">

                    <input
                        type="number"
                        id="qty-drpepper"
                        value="1"
                        min="1">

                    <button
                        onclick="addToCart('Dr Pepper', 30, 'qty-drpepper')">
                        Add
                    </button>

                </div>

            </div>


            <!-- CHICKEN NOODLE SNACK -->

            <div class="product-card">

                <img
                    src="https://images.cdn.saveonfoods.com/detail/00074410700799.jpg"
                    alt="Chicken Noodle Snack">

                <h3>Chicken Noodle Snack</h3>

                <p>NT$25</p>

                <div class="product-actions">

                    <input
                        type="number"
                        id="qty-noodle"
                        value="1"
                        min="1">

                    <button
                        onclick="addToCart('Chicken Noodle Snack', 25, 'qty-noodle')">
                        Add
                    </button>

                </div>

            </div>


            <!-- BUNDLE PACK -->

            <div class="product-card">

                <img
                    src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/Dr_Pepper_Dose_2024.jpg/500px-Dr_Pepper_Dose_2024.jpg"
                    alt="Bundle Pack">

                <h3>Bundle Pack</h3>

                <p>1 Dr Pepper + 1 Chicken Noodle Snack</p>

                <p>NT$50</p>

                <div class="product-actions">

                    <input
                        type="number"
                        id="qty-bundle"
                        value="1"
                        min="1">

                    <button
                        onclick="addToCart('Bundle Pack', 50, 'qty-bundle')">
                        Add
                    </button>

                </div>

            </div>


            <!-- CHOCOLATE -->

            <div class="product-card">

                <img
                    src="https://i.ebayimg.com/images/g/WboAAOSwPhBoI-cE/s-l1200.jpg"
                    alt="Chocolate">

                <h3>Chocolate</h3>

                <p>NT$20</p>

                <div class="product-actions">

                    <input
                        type="number"
                        id="qty-chocolate"
                        value="1"
                        min="1">

                    <button
                        onclick="addToCart('Chocolate', 20, 'qty-chocolate')">
                        Add
                    </button>

                </div>

            </div>

        </section>


        <!-- =========================
             CART
        ========================= -->

        <aside class="cart">

            <h2>🛒 Cart</h2>

            <div id="cart-items">
                Your cart is empty.
            </div>

            <h3>
                Total:
                NT$<span id="cart-total">0</span>
            </h3>

            <div class="customer-section">

                <label for="customerName">
                    Your Name
                </label>

                <input
                    type="text"
                    id="customerName"
                    readonly>

            </div>

            <button
                onclick="checkout()"
                class="checkout-button">
                Checkout
            </button>

        </aside>


        <!-- =========================
             ORDER HISTORY
        ========================= -->

        <section
            id="order-history"
            style="display:none;">

            <h2>📦 Order History</h2>

            <div id="history-list">
                Loading...
            </div>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script type="module">

        import "./script.js";

        // ========================================
        // MENU
        // ========================================

        window.toggleMenu = function () {

            const menu =
                document.getElementById("menuDropdown");

            if (!menu) return;

            menu.classList.toggle("show");
        };


        window.closeMenu = function () {

            const menu =
                document.getElementById("menuDropdown");

            if (!menu) return;

            menu.classList.remove("show");
        };


        // ========================================
        // CLOSE MENU WHEN CLICKING OUTSIDE
        // ========================================

        document.addEventListener("click", function (event) {

            const menuContainer =
                document.querySelector(".menu-container");

            if (!menuContainer) return;

            if (!menuContainer.contains(event.target)) {
                closeMenu();
            }

        });

    </script>

</body>

</html>
