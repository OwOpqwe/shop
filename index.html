<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snack Store</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<!-- ================= HEADER ================= -->

<header>

    <div class="header-center">

        <h1>Snack Store</h1>

        <div class="cash-only">
            CASH ONLY
        </div>

    </div>

    <div id="userInfo">

        <span>
            Welcome,
            <span id="userName"></span>
        </span>

        <button id="logoutBtn">
            Logout
        </button>

    </div>

</header>

<!-- ================= MAIN CONTENT ================= -->

<div class="main-container">

    <!-- ================= PRODUCTS ================= -->

    <div class="store-container">

        <!-- PRODUCT 1 -->
        <div class="item">

            <img
                src="https://upload.wikimedia.org/wikipedia/commons/0/0e/Dr_Pepper_can.jpg"
                alt="Dr Pepper"
            >

            <h3>Dr Pepper</h3>

            <p>NT$30</p>

            <div class="quantity">

                <input
                    id="input-DrPepper"
                    type="number"
                    min="1"
                    value="1"
                >

                <button
                    class="add-btn"
                    data-id="DrPepper"
                    data-price="30"
                >
                    Add
                </button>

            </div>

            <div class="cart-counter">
                In cart:
                <span id="qty-DrPepper">0</span>
            </div>

        </div>

        <!-- PRODUCT 2 -->
        <div class="item">

            <img
                src="https://upload.wikimedia.org/wikipedia/commons/5/59/Cup_noodle.jpg"
                alt="Chocolate"
            >

            <h3>Chocolate</h3>

            <p>NT$20</p>

            <div class="quantity">

                <input
                    id="input-Chocolate"
                    type="number"
                    min="1"
                    value="1"
                >

                <button
                    class="add-btn"
                    data-id="Chocolate"
                    data-price="20"
                >
                    Add
                </button>

            </div>

            <div class="cart-counter">
                In cart:
                <span id="qty-Chocolate">0</span>
            </div>

        </div>

    </div>

    <!-- ================= CART ================= -->

    <aside class="cart-panel">

        <div class="cart-header">
            Your Cart
        </div>

        <div class="customer-info">

            <label>
                Your Name
            </label>

            <input
                type="text"
                id="customerName"
            >

        </div>

        <div id="cart-items"></div>

        <div class="cart-total">
            Total: NT$<span id="total">0</span>
        </div>

        <button
            class="checkout-btn"
            id="checkoutBtn"
        >
            Checkout
        </button>

        <button
            class="history-btn"
            id="historyBtn"
        >
            Order History
        </button>

    </aside>

</div>

<script type="module" src="./script.js"></script>

</body>
</html>
