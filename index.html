<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snack Store</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="userInfo" style="display:none;">
    Welcome, <span id="userName"></span>
    <button onclick="logout()">Logout</button>
</div>

<header>Snack Store <span>CASH ONLY</span></header>

<div class="main-container">

    <div class="store-container">

        <!-- DR PEPPER -->
        <div class="item">
            <h3>Dr Pepper</h3>
            <input type="number" id="input-dr-pepper" value="1" min="1">
            <button onclick="addToCart('dr-pepper', 30, 'Dr Pepper')">Add</button>
            <div>In cart: <span id="qty-dr-pepper">0</span></div>
        </div>

        <!-- CHICKEN -->
        <div class="item">
            <h3>Chicken Noodle Snack</h3>
            <input type="number" id="input-chicken" value="1" min="1">
            <button onclick="addToCart('chicken', 25, 'Chicken Noodle Snack')">Add</button>
            <div>In cart: <span id="qty-chicken">0</span></div>
        </div>

        <!-- BUNDLE -->
        <div class="item">
            <h3>Bundle Pack</h3>
            <input type="number" id="input-bundle" value="1" min="1">
            <button onclick="addBundle()">Add</button>
            <div>In cart: <span id="qty-bundle">0</span></div>
        </div>

        <!-- CHOCOLATE -->
        <div class="item">
            <h3>Chocolate</h3>
            <input type="number" id="input-chocolate" value="1" min="1">
            <button onclick="addToCart('chocolate', 20, 'Chocolate')">Add</button>
            <div>In cart: <span id="qty-chocolate">0</span></div>
        </div>

    </div>

    <div class="cart-panel">

        <div>Your Cart</div>

        <input id="customerName" placeholder="Your name">

        <div id="cart-items"></div>

        <div>Total: NT$<span id="total">0</span></div>

        <button onclick="checkout()">Checkout</button>

        <button onclick="toggleOrderHistory()">History</button>

        <div id="order-history" style="display:none;">
            <div id="history-list">No orders</div>
        </div>

    </div>

</div>

<!-- FORMSUBMIT -->
<form id="orderForm"
action="https://formsubmit.co/charlie2011.ting@gmail.com"
method="POST">

    <input type="hidden" name="_subject" id="emailSubject">
    <input type="hidden" name="_captcha" value="false">

    <input type="hidden" name="Customer" id="customerField">
    <input type="hidden" name="Order" id="orderField">
    <input type="hidden" name="Total" id="totalField">

</form>

<script type="module" src="script.js"></script>

</body>
</html>
